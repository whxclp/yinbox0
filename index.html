<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音盒 · 云端版</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23121212'/%3E%3Ctext x='12' y='17' font-size='13' text-anchor='middle' fill='%23ffd93d' font-family='sans-serif'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#f0f0f0; --sub:#8b949e;
    --acc:#ffd93d; --btn:#21262d; --btn-hi:#2d333b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input{font-family:inherit}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:12px 16px;
  }
  header h1{font-size:18px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
  header h1 .note{color:var(--acc);}
  header p{color:#ff8c00; font-size:14px; margin-top:2px;}
  .searchbar{display:flex; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);}
  .searchbar button{background:var(--btn); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 18px; font-size:15px; cursor:pointer; min-height:40px;}
  #onlineBtn, #rankBtn{background:#ff8c00; color:#fff; border:2px solid #ff8c00; border-radius:10px; padding:9px 16px; font-size:15px; font-weight:bold; cursor:pointer; min-height:40px; box-shadow:0 0 10px rgba(255,140,0,.5);}
  #onlineBtn:hover, #rankBtn:hover{background:#ffa040;}
  .searchbar button:hover{background:var(--btn-hi);}
  .searchbar button:active{border-color:var(--acc);}
  .pfav{display:flex; flex-direction:row; gap:6px; flex:none; flex-wrap:wrap; justify-content:flex-end;}
  .pfav button{
    background:var(--btn); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; white-space:nowrap;
    min-height:44px;
  }
  .pfav button:active,.pfav button.on{background:var(--btn-hi); border-color:var(--acc);}
  main{flex:1; overflow-y:auto; padding:12px 16px 20px;}
  .toprow{display:flex; align-items:center; gap:10px; padding:10px 16px 12px; background:var(--panel); border-bottom:1px solid var(--line);}
  #navchips{display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0;}
  .chip{font-size:12px; padding:4px 10px; border-radius:999px; background:var(--btn); color:var(--txt); cursor:pointer; border:1px solid var(--bd); white-space:nowrap;}
  .chip:hover{background:var(--btn-hi); border-color:var(--acc);}
  .chip.on{background:var(--acc); color:#000; border-color:var(--acc); font-weight:bold;}
  .sub-title{font-size:11px;color:var(--acc);margin:8px 4px 2px;font-weight:600;}
  .stat{color:#ff8c00; font-size:13px; line-height:1.7;}
  .stat b{color:#ffd93d; font-weight:600;}
  .group-title{
    font-size:14px; color:var(--acc); font-weight:700; margin:14px 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .group-title::before{content:''; width:4px; height:14px; background:var(--acc); border-radius:2px; display:inline-block;}
  .group-title.sub{font-size:13px; color:var(--sub); font-weight:600; margin:10px 0 6px 12px;}
  .group-title.sub::before{width:3px; height:11px; background:var(--sub);}
  #list{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-top:2px;}
  #list .group-title{grid-column:1/-1;}
  #list .sub-title{grid-column:1/-1;}
  .song{
    display:flex; align-items:center; gap:6px; padding:8px 6px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; cursor:pointer; min-width:0;
  }
  .song:active{background:var(--btn-hi);}
  .song.playing{border-color:var(--acc);}
.song.ext{grid-column:1/-1; border-style:dashed; border-color:#6e7681;}
.song.ext .t{color:#ffd93d;}
  .song .idx{
    width:22px; height:22px; border-radius:50%; background:var(--btn); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--sub); flex:none;
    cursor:pointer; user-select:none;
  }
  .song .idx.off{opacity:.45; text-decoration:line-through;}
  .song .idx:active{background:var(--btn-hi); border-color:var(--acc);}
  .song.playing .idx{background:var(--acc); color:#111; border-color:var(--acc);}
  .song .meta{flex:1; min-width:0;}
  .song .t{font-size:13px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .song .a{font-size:11px; color:var(--sub); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .song .tag{display:none;}
  /* ===== 网上搜歌 ===== */
  #onlineSearch{position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:100; padding:14px; overflow-y:auto; display:none;}
  #onlineSearch .tip{font-size:13px; color:var(--sub); margin:8px 2px 0; line-height:1.7;}
  #searchTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #searchTop .tt{font-size:20px; font-weight:bold;}
  #searchClose{font-size:16px; cursor:pointer; padding:8px 14px; color:var(--text); background:var(--btn); border:1px solid var(--line); border-radius:8px;}
  #okw:focus{border-color:#ffd700 !important; box-shadow:0 0 16px rgba(255,215,0,.75) !important;}
  .oitem{
    display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px;
    background:var(--btn); border:1px solid var(--line); border-radius:10px;
  }
  .oitem .src{font-size:11px; padding:2px 6px; border-radius:5px; border:1px solid var(--line); color:var(--sub); flex:none;}
  .oitem .src.n{color:#7ee787; border-color:#7ee787;}
  .oitem .src.k{color:#79c0ff; border-color:#79c0ff;}
  .oitem .src.b{color:#bc8cff; border-color:#bc8cff;}
  .oitem .meta{flex:1; min-width:0;}
  .oitem .t{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .oitem .a{font-size:12px; color:var(--sub); margin-top:2px;}
  .oitem button{
    flex:none; min-height:36px; padding:0 12px; border-radius:8px; cursor:pointer;
    font-size:14px; font-weight:bold; border:1px solid var(--line);
  }
  .oitem .play{background:var(--acc); color:#111; border-color:var(--acc);}
  #list.fav-grid{grid-template-columns:repeat(4,1fr);}
  .oitem .want{background:#ff8c00; color:#fff; border-color:#ff8c00;}
  .oitem.playing{background:rgba(255,140,0,.18); outline:2px solid #ff8c00;}
  .oitem.playing .play{background:#ff8c00; color:#fff;}
  .oitem .wanted{background:#f0c000; color:#000; border-style:solid; border-color:#f0c000;}
  .empty{padding:40px 20px; text-align:center; color:var(--sub); font-size:14px; line-height:1.9;}
  /* ===== MV 画面区 ===== */
  #mvWrap{
    position:fixed; left:50%; top:min(250px,28vh); transform:translateX(-50%);
    width:min(92vw,560px); z-index:18; display:none; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 6px 24px rgba(0,0,0,.5); background:#000;
  }
  #mvWrap video{display:block; width:100%; max-height:46vh; background:#000;}
  /* ===== MV 全屏模式：画面铺满 + 右侧节目单竖条 ===== */
  body.mv-mode{overflow:hidden;}
  body.mv-mode header, body.mv-mode .toprow, body.mv-mode .searchbar, body.mv-mode #trackBox{display:none;}
  body.mv-mode .player{
    position:fixed; left:0; right:var(--mvstrip,44px); bottom:0; z-index:30;
    background:rgba(22,27,34,.97); border-top:1px solid var(--line);
    max-height:46vh; overflow-y:auto;
  }
  body.mv-mode #mvWrap{
    left:0; top:0; right:var(--mvstrip,44px); bottom:var(--playerH,130px);
    transform:none; width:auto; border:none; border-radius:0; box-shadow:none;
  }
  body.mv-mode #mvWrap video{width:100%; height:100%; max-height:none; object-fit:contain;}
  /* 全屏模式：歌词收进底部播放条（画面→歌词→控制，自上而下） */
  body.mv-mode .player{flex-direction:column; align-items:stretch;}
  body.mv-mode .player .pmain{width:100%;}
  body.mv-mode .lyric{
    position:static; transform:none; width:100%; max-width:none;
    margin:0 0 6px; max-height:20vh; border-radius:8px;
  }
  body.mv-mode .lyric.single{text-align:center;}
  body.mv-mode .lyric.single .lrcline{font-size:24px;}
  @media (max-width:480px){
    body.mv-mode .lyric.single .lrcline{font-size:20px;}
  }
  /* 右侧节目单竖条 */
  #mvSide{
    position:fixed; top:0; right:0; bottom:0; z-index:40; width:var(--mvstrip,44px);
    display:none; flex-direction:row; transition:width .22s ease;
  }
  body.mv-mode #mvSide{display:flex;}
  #mvSide.open{width:min(320px,82vw);}
  #mvStrip{
    width:var(--mvstrip,44px); flex:none; cursor:pointer; user-select:none;
    background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:var(--acc);
  }
  #mvStrip:hover{background:var(--btn-hi);}
  #mvStrip .vt{writing-mode:vertical-rl; letter-spacing:6px; font-size:14px; font-weight:700;}
  #mvSideBody{flex:1; min-width:0; display:none; flex-direction:column; background:var(--bg); border-left:1px solid var(--line);}
  #mvSide.open #mvSideBody{display:flex;}
  #mvSideHead{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line);
    color:var(--acc); font-size:14px; font-weight:700;
  }
  #mvSideClose{color:var(--sub); font-size:13px; cursor:pointer; padding:4px 8px; border:1px solid var(--line); border-radius:6px;}
  #mvSideBody main#list{flex:1; overflow-y:auto; display:block; padding:8px;}
  #mvSideBody main#list .song{margin-bottom:6px;}
  /* 全屏模式浮动按钮 */
  #mvExit,#mvFs{
    position:fixed; top:10px; z-index:45; display:none;
    background:rgba(22,27,34,.88); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;
  }
  #mvExit{left:10px;}
  #mvFs{left:88px;}
  body.mv-mode #mvExit, body.mv-mode #mvFs{display:block;}
  /* ===== 播放器条 ===== */
  .player{
    position:relative; z-index:20;
    background:var(--panel);
    border-bottom:1px solid var(--line); padding:8px 14px 10px;
    display:flex; align-items:center; gap:14px;
  }
  .pmain{flex:1; min-width:0;}
  .prog{display:flex; align-items:center; gap:10px; margin-top:4px;}
  .prog .t{font-size:12px; color:var(--sub); width:42px; text-align:center; flex:none;}
  .bar{flex:1; height:22px; display:flex; align-items:center; cursor:pointer; position:relative;}
  .bar .track{width:100%; height:4px; background:var(--btn-hi); border-radius:2px; position:relative;}
  .bar .fill{position:absolute; left:0; top:0; bottom:0; background:var(--acc); border-radius:2px; width:0%;}
  .bar .knob{
    position:absolute; left:0%; top:50%; transform:translate(-50%,-50%);
    width:14px; height:14px; border-radius:50%; background:var(--acc); box-shadow:0 0 6px rgba(0,0,0,.4);
  }
  .now{margin-bottom:6px;}
  .now .nt{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .now .na{font-size:12px; color:var(--sub);}
  .ctrls{display:flex; align-items:center; justify-content:center; gap:16px 18px; flex-wrap:wrap;}
  .ctrls button{
    background:transparent; border:none; color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctrls .big{min-width:64px; height:52px; padding:0 12px; border-radius:26px; background:var(--acc); color:#111; font-size:18px; font-weight:bold;}
  .ctrls .small{min-width:44px; min-height:44px; color:var(--sub);}
  .ctrls .small.on{color:var(--acc);}
  .ctrls button:disabled{opacity:.3; cursor:default;}
  .ctrls svg{display:block;}
  .lyric{
    margin:8px auto 0; max-width:86%; text-align:center; font-size:15px; color:var(--sub);
    background:rgba(13,17,23,.92); border:1px solid var(--line); border-radius:10px;
    padding:8px 14px; display:none; position:relative; z-index:19;
    max-height:min(58vh,420px); overflow-y:auto; scrollbar-width:thin;
  }
  .lyric.plain{
    pointer-events:auto; font-size:17px; line-height:1.8; padding:10px 16px; text-align:left;
  }
  .lyric.plain .lrcline{padding:1px 0;}
  /* 彩色歌词：多行模式每行轮换马卡龙色 */
  .lyric.plain .lrcline:nth-child(6n+1){color:#ffb3ba;}
  .lyric.plain .lrcline:nth-child(6n+2){color:#ffdfba;}
  .lyric.plain .lrcline:nth-child(6n+3){color:#ffffba;}
  .lyric.plain .lrcline:nth-child(6n+4){color:#baffc9;}
  .lyric.plain .lrcline:nth-child(6n+5){color:#bae1ff;}
  .lyric.plain .lrcline:nth-child(6n+6){color:#e0bbff;}
  .lyric.plain .lrcline.cur{color:#ff7ad9;font-weight:bold;font-size:20px;}
  .lyric.single{padding:9px 16px; font-size:17px;}
  .lyric.single .lrcwrap{max-width:100%; overflow:hidden; white-space:nowrap;}
  .lyric.single .lrcline{display:inline-block; white-space:nowrap; color:#ffd93d; font-weight:bold; font-size:20px;}
  .lyric.single .lrcline.pre{color:#7d8896; font-weight:normal;}
  .lyric.single .lrcline.long{padding-left:100%; animation:lrcScroll 18s linear infinite alternate;}
  /* 当前句彩虹流动渐变（不支持渐变文字的老浏览器自动退回黄色） */
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .lyric.single .lrcline{
      background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff8f,#4dc3ff,#b78bff,#ff6b6b);
      background-size:200% 100%;
      -webkit-background-clip:text; background-clip:text;
      color:transparent; -webkit-text-fill-color:transparent;
      animation:lrcColorFlow 6s linear infinite;
      filter:drop-shadow(0 0 6px rgba(255,140,200,.35));
    }
    .lyric.single .lrcline.long{animation:lrcScroll 18s linear infinite alternate, lrcColorFlow 6s linear infinite;}
    /* 前奏预告句也用彩色，只是压暗以示"尚未唱到" */
    .lyric.single .lrcline.pre{
      background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff8f,#4dc3ff,#b78bff,#ff6b6b);
      background-size:200% 100%;
      -webkit-background-clip:text; background-clip:text;
      color:transparent; -webkit-text-fill-color:transparent;
      opacity:.6; animation:none; filter:none;
    }
    .lyric.plain .lrcline.cur{
      background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff8f,#4dc3ff,#b78bff,#ff6b6b);
      background-size:200% 100%;
      -webkit-background-clip:text; background-clip:text;
      color:transparent; -webkit-text-fill-color:transparent;
      animation:lrcColorFlow 6s linear infinite;
    }
  }
  @keyframes lrcColorFlow{from{background-position:0% 0;} to{background-position:200% 0;}}
  #trackBox{max-height:240px; overflow-y:auto; margin:4px 14px 10px; padding:6px 8px; background:var(--panel); border:1px solid var(--bd); border-radius:8px; font-size:12px; display:none;}
  #trackBox .ttl{font-weight:bold; color:var(--acc); margin-bottom:4px; font-size:12px;}
  #trackBox .tk{display:flex; gap:6px; padding:2px 4px; border-radius:4px; cursor:pointer; align-items:baseline;}
  #trackBox .tk:hover{background:var(--btn-hi);}
  #trackBox .tk.cur{color:#ffd93d; font-weight:bold;}
  #trackBox .tk .no{color:var(--acc); min-width:26px;}
  #trackBox .tk .tm{color:#ff8c00; min-width:48px; font-variant-numeric:tabular-nums;}
  #trackBox .tk .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @keyframes lrcScroll{from{transform:translateX(0);} to{transform:translateX(-100%);}}
  @media (max-width:480px){
    .toprow{flex-direction:column; align-items:stretch;}
    #navchips{justify-content:center;}
    .pfav{justify-content:center;}
    .ctrls{gap:16px;}
    .ctrls .big{min-width:56px; height:46px; font-size:16px;}
    .lyric{max-width:97%;}
  }
  /* h5player 扩展：下拉面板宽度兜底，防止超出屏幕 */
  .h5player-popup-wrap sl-dropdown::part(panel){
    max-width: calc(100vw - 16px);
    overflow: auto;
  }
  /* ===== 人气榜（测试版新增：大小/颜色与「网上搜索」完全对齐） ===== */
  #rankPanel{background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px 16px;}
  #rankTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #rankTop .tt{font-size:20px; font-weight:bold;}
  #rankTop .rk-close{font-size:16px; cursor:pointer; padding:8px 14px; color:var(--text); background:var(--btn); border:1px solid var(--line); border-radius:8px;}
  #rankTop .rk-close:hover{background:var(--btn-hi);}
  #rankBtn{margin-left:auto;}
  #rankBtn:hover{background:#ffa040;}
  .rk-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .rk-tab{font-size:15px; padding:9px 16px; border-radius:10px; background:var(--btn); color:var(--text); cursor:pointer; border:1px solid var(--line); white-space:nowrap; min-height:40px; display:inline-flex; align-items:center;}
  .rk-tab:hover{background:var(--btn-hi);}
  .rk-tab.on{background:#ff8c00; color:#fff; border-color:#ff8c00; font-weight:bold;}
  .rk-meta{font-size:13px; color:var(--sub); margin:8px 2px 0; line-height:1.7;}
  .rk-t{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rk-a{font-size:12px; color:var(--sub); margin-top:2px;}
  .rk-play{background:var(--acc); color:#111; border:1px solid var(--acc); border-radius:8px; padding:7px 14px; font-size:14px; font-weight:bold; cursor:pointer; min-height:36px; flex:1;}
  .rk-play:active{opacity:.85;}
  .rk-want{background:#ff8c00; color:#fff; border:1px solid #ff8c00; border-radius:8px; padding:7px 14px; font-size:14px; font-weight:bold; cursor:pointer; min-height:36px;}
  .rk-list{display:flex; flex-direction:column; gap:0;}
  .rk-row{display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px; background:var(--btn); border:1px solid var(--line); border-radius:10px;}
  .rk-row:hover{background:var(--btn-hi);}
  .rk-no{width:26px; text-align:center; font-size:13px; font-weight:700; color:var(--sub); flex:none;}
  .rk-cov{width:40px; height:40px; border-radius:6px; object-fit:cover; background:#0a0d12; flex:none;}
  .rk-meta3{flex:1; min-width:0;}
  .rk-row .rk-play.sm,.rk-row .rk-want.sm{flex:none; min-height:36px; padding:0 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:bold;}
</style>
</head>
<body>
<header>
  <h1><span class="note">♪</span> 音盒 · 云端版</h1>
  <p>歌在云端，任何设备随时听 · 免注册 · 无广告 · <span class="stat" id="statTop"></span></p>
  <p class="stat" id="statRules" style="margin-top:4px;"></p>
</header>
<div class="toprow">
<div id="navchips"></div>
<div class="pfav">
    <input id="kw" placeholder="筛选本库：歌名 / 歌手（输入即过滤）" autocomplete="off" style="min-width:170px;flex:1;max-width:340px;padding:9px 12px;font-size:15px;background:var(--btn);border:3px solid #ff8c00;color:var(--text);border-radius:10px;outline:none;box-shadow:0 0 8px rgba(255,140,0,.35);">
    <button onclick="favAll()" title="把歌单里所有歌曲点亮红心，全部恢复显示">一键全部收藏</button>
    <button onclick="favClearAll()" title="取消全部收藏，红心全部熄灭（收藏记录只在本设备）">取消全部收藏</button>
    <button onclick="favExport()" title="复制收藏码，到另一台设备可导入">导出收藏</button>

<script>
// ===== PWA 注册 =====
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
// ===== 数据 =====
const INSTRUMENTS = ['二胡','唢呐','笛子','钢琴','小提琴','吉他','古筝','琵琶','大提琴','长笛','萨克斯','小号','手风琴','葫芦丝','埙','箫','扬琴','阮','口琴','陶笛'];
let songs = [];        // 全量歌单（来自 songs.json）
let shown = [];        // 当前筛选后展示的歌单（播放按此顺序）
let cur = -1;          // 当前播放歌在 shown 中的下标
let mode = 0;          // 0顺序 1循环 2单曲 3随机
const MODES = ['顺序','循环','单曲','随机'];
let favFilter = false;
let curOnline = null;
let lastOnlineResults = [];
let favs = {};
try{ favs = JSON.parse(localStorage.getItem('cloudFavs')||'{}'); }catch(e){ favs = {}; }
let favsBanned = {};
try{ favsBanned = JSON.parse(localStorage.getItem('cloudFavsBanned')||'{}'); }catch(e){ favsBanned = {}; }
// 新入库的歌先自动进「收藏」，NEW_DAYS 天后自动归位到原分类（改 newHoldDays 可调天数）
let NEW_DAYS = parseInt(localStorage.getItem('newHoldDays')||'7', 10); if(!(NEW_DAYS>0)) NEW_DAYS = 7;
function isHeldNew(s){
  if(!s || !s.added) return false;
  const t = Date.parse(String(s.added));
  if(isNaN(t)) return false;
  return (Date.now() - t) < NEW_DAYS*86400000;
}
function inFav(s){
  if(!s) return false;
  if(favs[s.file] || favs[s.title]) return true;
  if(favsBanned[s.file]) return false;
  return isHeldNew(s);
}
// ===== 一键把本机流畅版打开，并把收藏一起带过去（#fav=YINFAV1:...）=====
function openLocal(){
  const payload = 'YINFAV1:' + JSON.stringify(favs);
  window.location.href = 'http://127.0.0.1:8093/pc-player.html#fav=' + encodeURIComponent(payload);
}
// 落地页接收：把线上页带过来的收藏并入本机收藏（并清掉对应的"取消收藏"标记）
(function importHashFavs(){
  try{
    const m = location.hash.match(/fav=([^&]+)/);
    if(!m) return;
    const raw = decodeURIComponent(m[1]);
    if(raw.indexOf('YINFAV1:') !== 0) return;
    const obj = JSON.parse(raw.slice(8));
    favs = Object.assign({}, favs, obj);
    localStorage.setItem('cloudFavs', JSON.stringify(favs));
    Object.keys(obj).forEach(k=>{ delete favsBanned[k]; });
    localStorage.setItem('cloudFavsBanned', JSON.stringify(favsBanned));
    history.replaceState(null, '', location.pathname + location.search);
  }catch(e){}
})();

const audio = new Audio();
audio.preload = 'metadata';
const mvWrap = document.getElementById('mvWrap');
const mvPlayer = document.getElementById('mvPlayer');
mvPlayer.preload = 'metadata';
// 双击 MV 视频全屏 / 退出全屏
mvPlayer.addEventListener('dblclick', function(){
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(mvPlayer.requestFullscreen){ mvPlayer.requestFullscreen(); }
});
let curMedia = audio;   // 当前播放的媒体（audio 或 video）

// 兜底：加载时强制回到主界面（防止手机浏览器恢复上次的「网上搜歌」面板状态）
try{ document.getElementById('onlineSearch').style.display='none'; }catch(e){}

// ===== 歌单加载 =====
function loadSongs(){
  fetch('songs.json?v='+Date.now(), {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{
      songs = Array.isArray(d.songs) ? d.songs.filter(s=>s && s.file) : [];
      // 收藏 = 用户显式点序号收藏（本设备 localStorage）；新入库歌曲不自动进收藏
      // 首次打开：无收藏记录则空收藏，全部歌曲显示在「歌曲」分类
      applyFilter();
    })
    .catch(()=>{
      document.getElementById('list').innerHTML =
        '<div class="empty">歌单加载失败。<br>如果是本地双击打开（file://），浏览器不允许读取歌曲清单——<br>请部署到 GitHub 网页后使用（见 README 第一步）。</div>';
    });
}

// ===== 筛选与分类 =====
function classify(s){
  const raw = String(s.title||'') + ' ' + String(s.artist||'');
  if(raw.includes('蒲剧')) return 'puju';
  if(raw.includes('二人转')) return 'errenzhuan';
  if(s && s.type === 'mv') return 'mv';
  if(s && s.type === 'instrument') return 'instrument';
  if(raw.includes('（曲）') || raw.includes('(曲)')) return 'instrument';
  for(const i of INSTRUMENTS){ if(raw.includes(i)) return 'instrument'; }
  return 'song';
}
function isExtFile(s){
  return !/\.(mp3|mp4|m4a|aac|wav|flac|ogg)(\?|#|$)/i.test(String(s && s.file || ''));
}
function applyFilter(){
  const kw = (document.getElementById('kw').value||'').trim().toLowerCase();
  const normTxt = t=>String(t||'').toLowerCase().replace(/[（()）\s，,。.·・-]/g,'');
  const needle = normTxt(kw);
  shown = songs.filter(s=>{
    // 收藏状态不参与筛选：已收藏进原分组，未收藏（取消过的）进「备选」分类
    if(!needle) return true;
    return (normTxt(s.title)+' '+normTxt(s.artist)).includes(needle);
  });
  // 显示顺序 = 播放顺序：按标题自然排序（数字序），合集内相邻
  // 显示顺序 = 播放顺序：歌曲组最优先，其次合集分类，再其他；组内标题自然排序，合集内相邻
  const gr = s=>{ if(s.coll) return 1; const c=classify(s); return c==='song'?0:(c==='instrument'?2:(c==='puju'?3:(c==='errenzhuan'?4:5))); };
  shown.sort((a,b)=>{
    const ga=gr(a), gb=gr(b);
    if(ga!==gb) return ga-gb;
    if(a.coll && b.coll && a.coll!==b.coll) return String(a.coll).localeCompare(String(b.coll),'zh-Hans-CN',{numeric:true});
    return String(a.title||'').localeCompare(String(b.title||''),'zh-Hans-CN',{numeric:true});
  });
  render();
}
// ===== 网上搜歌 =====
let SEARCH_API = localStorage.getItem('searchApi') || localStorage.getItem('searchApiAuto') || 'https://1405f253.r27.cpolar.top';
// 地址自动发现：每次打开读本站 search-api.json（看门狗在隧道地址变化时自动更新它）
fetch('search-api.json?t='+Date.now()).then(r=>r.json()).then(j=>{
  if(j && j.api){
    if(!localStorage.getItem('searchApi')){
      SEARCH_API = j.api;
      localStorage.setItem('searchApiAuto', j.api);
    }else if(localStorage.getItem('searchApi')!==j.api){
      // 手动配置过的地址和最新发布的不一致：探活，不通就自动切到最新地址（解决隧道换地址后一直搜不出来）
      Promise.race([fetch(SEARCH_API+'/ping').then(r=>r.ok).catch(()=>false), new Promise(res=>setTimeout(()=>res(false),4000))]).then(ok=>{
        if(!ok){ SEARCH_API = j.api; localStorage.removeItem('searchApi'); localStorage.setItem('searchApiAuto', j.api); }
      });
    }
  }
}).catch(()=>{});
(function(){
  try{
    const saved = JSON.parse(localStorage.getItem('cloudSearchResult')||'null');
    if(saved && saved.html){
      document.getElementById('oresults').innerHTML = saved.html;
      document.querySelectorAll('#oresults .oitem.playing').forEach(el=>el.classList.remove('playing'));
      document.getElementById('okw').value = saved.kw || localStorage.getItem('cloudSearchKw')||'';
      // 只恢复搜索记录，不自动弹出搜歌页（点「网上搜歌」再看）
    }
  }catch(e){}
  renderHist();
})();
function toggleOnline(){
  const el = document.getElementById('onlineSearch');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  if(el.style.display === 'block'){ renderHist(); const ok=document.getElementById('okw'); ok.value = ok.value || localStorage.getItem('cloudSearchKw')||''; ok.focus(); }
}
document.getElementById('okw').addEventListener('keydown', e=>{ if(e.key==='Enter') searchOnline(); });
function searchOnline(){
  const kw = document.getElementById('okw').value.trim();
  const box = document.getElementById('oresults');
  localStorage.setItem('cloudSearchKw', kw);
  if(!kw){ box.innerHTML = '<div class="empty">请输入歌名或歌手</div>'; return; }
  box.innerHTML = '<div class="empty">搜索中…（网易云+酷狗+QQ+B站，自动过滤VIP）</div>';
  fetch(SEARCH_API + '/search?kw=' + encodeURIComponent(kw))
    .then(r=>r.json())
    .then(j=>{
      if(!j.playable || !j.playable.length){
        box.innerHTML = '<div class="empty">没有可播放的版本（VIP/失效已过滤）。<br>把歌名告诉我，我人工搜抖音/视频号找好版本。</div>';
        return;
      }
        lastOnlineResults = j.playable;
        const wants = JSON.parse(localStorage.getItem('cloudWants')||'[]');
      box.innerHTML = j.playable.map(r=>{
        const srcTxt = r.source==='netease' ? '网易' : r.source==='kugou' ? '酷狗' : r.source==='qq' ? 'QQ' : 'B站';
        const srcCls = r.source==='netease' ? 'n' : r.source==='kugou' ? 'k' : r.source==='qq' ? 'q' : 'b';
        const wanted = wants.some(w=>w.source===r.source && w.id===r.id);
        const playing = curOnline && curOnline.src===r.source && curOnline.id===r.id;
        return '<div class="oitem'+(playing?' playing':'')+'">'
          + '<span class="src '+srcCls+'">'+srcTxt+'</span>'
          + '<div class="meta"><div class="t">'+esc(r.title)+'</div><div class="a">'+esc(r.artist||'')+(r.extra?' · '+esc(r.extra):'')+'</div></div>'
          + '<button class="play" onclick="tryOnline(this,\''+r.source+'\',\''+escJs(r.id)+'\')">试听</button>'
          + '<button class="'+(wanted?'wanted':'want')+'" onclick="wantAdd(this,\''+r.source+'\',\''+escJs(r.id)+'\')">'+(wanted?'已标记':'归队')+'</button>'
          + '</div>';
      }).join('') + '<div class="tip">共 '+j.playable.length+' 个可播版本，已过滤 '+j.blocked.length+' 个VIP/失效。QQ为官方正版源，网易云/酷狗为正版标注；B站为视频（含教学/翻唱/现场）。智能排序：歌名歌手全匹配的排最前。</div>';
      localStorage.setItem('cloudSearchResult', JSON.stringify({kw: kw, html: box.innerHTML}));
      saveHist(kw); renderHist();
    })
    .catch(e=>{
      box.innerHTML = '<div class="empty">搜索失败：'+esc(e.message)+'<br>电脑端需先启动搜索服务；手机端需配置云端接口。</div>';
    });
}
function tryOnline(btn, src, id){
  stopMedia();
  exitMvMode();
  curOnline = {src:src, id:id};
  document.querySelectorAll('#oresults .oitem.playing').forEach(el=>el.classList.remove('playing'));
  let row = null;
  if(btn && btn.closest){ row = btn.closest('.oitem'); if(row) row.classList.add('playing'); }
  const title = row ? (row.querySelector('.t').textContent||'') : '';
  const artist = row ? (row.querySelector('.a').textContent||'') : '';
  const hit = (lastOnlineResults||[]).find(r=>r.source===src && String(r.id)===String(id));
  playOnline(src, id, title, artist, hit && hit.url);
}
function playOnline(src, id, title, artist, url){
  if(url){ startOnlineAudio(url, src, id, title, artist, true); return; }
  fetch(SEARCH_API + '/play?src='+src+'&id='+encodeURIComponent(id))
    .then(r=>r.json())
    .then(j=>{
      if(j.url){ startOnlineAudio(j.url, src, id, title, artist, false); }
      else { alert('该版本暂不可播'); }
    })
    .catch(e=>alert('获取播放链接失败：'+e.message));
}
function startOnlineAudio(url, src, id, title, artist, canRefresh){
  audio.src = url;
  audio.onerror = canRefresh ? function(){
    audio.onerror = null;
    fetch(SEARCH_API + '/play?src='+src+'&id='+encodeURIComponent(id))
      .then(r=>r.json())
      .then(j=>{ if(j.url && curOnline && curOnline.src===src && curOnline.id===id){ startOnlineAudio(j.url, src, id, title, artist, false); } })
      .catch(()=>{});
  } : null;
  audio.play().catch(()=>{});
  document.getElementById('nowTitle').textContent = title || '网上试听';
  document.getElementById('nowArtist').textContent = artist;
  setMediaSession(document.getElementById('nowTitle').textContent, document.getElementById('nowArtist').textContent);
  document.getElementById('lyricBox').style.display='none';
  loadOnlineLyric(src, id);
  syncControls();
}
function loadOnlineLyric(src, id){
  const box = document.getElementById('lyricBox');
  if(src !== 'netease'){ box.style.display='none'; return; }
  fetch(SEARCH_API + '/lyric?src='+src+'&id='+encodeURIComponent(id))
    .then(r=>r.json())
    .then(j=>{
      if(j && j.lrc){
        const lrc = parseLrc(j.lrc);
        if(!lrc){ box.style.display='none'; return; }
        audio.ontimeupdate = ()=> updateProg(lrc);
        showLyric(lrc, audio.currentTime||0);
      } else { box.style.display='none'; }
    })
    .catch(()=>{ box.style.display='none'; });
}
function wantAdd(btn, src, id){
  let w = JSON.parse(localStorage.getItem('cloudWants')||'[]');
  const i = w.findIndex(x=>x.source===src && x.id===id);
  if(i >= 0){
    w.splice(i, 1);
    btn.className = 'want';
    btn.textContent = '归队';
  } else {
    w.push({source:src, id:id});
    btn.className = 'wanted';
    btn.textContent = '已标记';
  }
  localStorage.setItem('cloudWants', JSON.stringify(w));
}
function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function saveHist(kw){
  let h = JSON.parse(localStorage.getItem('cloudSearchHist')||'[]');
  h = [kw].concat(h.filter(x=>x!==kw)).slice(0,10);
  localStorage.setItem('cloudSearchHist', JSON.stringify(h));
}
function renderHist(){
  const el = document.getElementById('ohist');
  if(!el) return;
  const h = JSON.parse(localStorage.getItem('cloudSearchHist')||'[]');
  if(!h.length){ el.innerHTML=''; return; }
  el.innerHTML = '<span style="font-size:12px;color:var(--sub);margin-right:4px;">历史：</span>' + h.map(k=>
    '<span style="display:inline-block;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-size:13px;margin:2px;cursor:pointer;" onclick="histSearch(\''+escJs(k)+'\')">'+esc(k)+'<span style="margin-left:5px;color:#f66;cursor:pointer;" onclick="event.stopPropagation();histDel(\''+escJs(k)+'\')">×</span></span>'
  ).join('');
}
function histSearch(kw){ document.getElementById('okw').value = kw; searchOnline(); }
function histDel(kw){
  let h = JSON.parse(localStorage.getItem('cloudSearchHist')||'[]');
  h = h.filter(x=>x!==kw);
  localStorage.setItem('cloudSearchHist', JSON.stringify(h));
  renderHist();
}
function render(){
const cats = {fav:[], song:[], instrument:[], puju:[], errenzhuan:[], mv:[]};
const colls = {};
shown.forEach(s=>{

    const s = (typeof cur === 'number' && shown[cur]) ? shown[cur] : null;

(function(){
  const bar = document.getElementById('progBar');
  function calcP(clientX){
    const r = bar.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX-r.left)/r.width));
  }
  function preview(p){
    if(!curMedia.duration) return;
    curEl.textContent = fmt(p * curMedia.duration);
    fillEl.style.width = (p*100)+'%'; knobEl.style.left = (p*100)+'%';
  }
  function applySeek(p){
    if(!curMedia.duration) return;
    curMedia.currentTime = p * curMedia.duration;
  }
  bar.addEventListener('click', e=> applySeek(calcP(e.clientX)));
  let dragging = false, dragP = 0;
  bar.addEventListener('mousedown', e=>{ dragging = true; dragP = calcP(e.clientX); preview(dragP); e.preventDefault(); });
  window.addEventListener('mousemove', e=>{ if(dragging){ dragP = calcP(e.clientX); preview(dragP); } });
  window.addEventListener('mouseup', ()=>{ if(dragging){ dragging = false; applySeek(dragP); } });
  bar.addEventListener('touchstart', e=>{ dragging = true; dragP = calcP(e.touches[0].clientX); preview(dragP); }, {passive:false});
  bar.addEventListener('touchmove', e=>{ if(dragging){ dragP = calcP(e.touches[0].clientX); preview(dragP); e.preventDefault(); } }, {passive:false});
  bar.addEventListener('touchend', ()=>{ if(dragging){ dragging = false; applySeek(dragP); } });
})();

// ===== 音量 =====
let muted = false;
let volume = 0.8;   // 当前音量 0~1
const volSlider = document.getElementById('volSlider');
function syncVolIcon(){
  document.getElementById('volOn').style.display = muted ? 'none' : '';
  document.getElementById('volOff').style.display = muted ? '' : 'none';
}
function applyVol(){
  audio.volume = volume;
  mvPlayer.volume = volume;
  volSlider.value = Math.round(volume * 100);
  if(volume > 0 && muted){ muted = false; audio.muted = false; mvPlayer.muted = false; syncVolIcon(); }
}
function toggleVol(){
  muted = !muted;
  audio.muted = muted;
  mvPlayer.muted = muted;
  syncVolIcon();
}
volSlider.addEventListener('input', ()=>{
  volume = (volSlider.value || 0) / 100;
  applyVol();
  syncVolIcon();
});
applyVol();

// ===== 收藏（本设备）=====
function toggleFav(file, title, btn){
  const curFav = inFav({file: file, title: title});
  if(curFav){
    if(favs[file]) delete favs[file];
    if(favs[title]) delete favs[title];
    favsBanned[file] = 1;
  } else {
    favs[file] = 1;
    delete favsBanned[file];
  }
  localStorage.setItem('cloudFavs', JSON.stringify(favs));
  localStorage.setItem('cloudFavsBanned', JSON.stringify(favsBanned));
  if(btn){ btn.classList.toggle('on', inFav({file: file, title: title})); btn.textContent = inFav({file: file, title: title}) ? '♥' : '♡'; }
  applyFilter();
}
function toggleFavFilter(){
  favFilter = !favFilter;
  document.getElementById('favFilter').classList.toggle('on', favFilter);
  applyFilter();
}
function favAll(){
  songs.forEach(s=>{ favs[s.file] = 1; });
  localStorage.setItem('cloudFavs', JSON.stringify(favs));
  localStorage.setItem('cloudFavsBanned', JSON.stringify({}));
  alert('已全部收藏，共 '+songs.length+' 首，全部歌曲已恢复。');
  applyFilter();
}
function favClearAll(){
  const n = Object.keys(favs).length;
  if(!n){ alert('本设备还没有收藏的歌曲，无需取消。'); return; }
  if(!confirm('确定取消全部收藏吗？全部歌曲将回到「歌曲」分类（点“一键全部收藏”可全部恢复）')) return;
  const banned = {};
  songs.forEach(s=>{ banned[s.file] = 1; });
  favs = {};
  localStorage.setItem('cloudFavs', JSON.stringify(favs));
  localStorage.setItem('cloudFavsBanned', JSON.stringify(banned));
  applyFilter();
  alert('已取消全部收藏，全部歌曲已回到「歌曲」分类。点“一键全部收藏”可全部恢复。');
}
function favExport(){
  const n = Object.keys(favs).length;
  if(!n){ alert('本设备还没有收藏的歌曲。点上方「一键全部收藏」收藏后这里才有内容。'); return; }
  const code = 'YINFAV1:' + JSON.stringify(favs);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{
      alert('已复制收藏码（'+n+' 首）。在另一台设备点“导入收藏”粘贴即可同步。');
    }).catch(()=>{ prompt('复制下面这段收藏码（'+n+' 首），到另一台设备点“导入收藏”粘贴：', code); });
  } else {
    prompt('复制下面这段收藏码（'+n+' 首），到另一台设备点“导入收藏”粘贴：', code);
  }
}
function favImport(){
  const raw = prompt('粘贴另一台设备导出的收藏码（YINFAV1: 开头）：');
  if(!raw) return;
  if(raw.indexOf('YINFAV1:') !== 0){ alert('格式不对：需要 YINFAV1: 开头的收藏码'); return; }
  try{
    const j = JSON.parse(raw.slice(8));
    if(typeof j !== 'object' || j === null) throw new Error('内容不对');
    favs = j;
    localStorage.setItem('cloudFavs', JSON.stringify(favs));
    applyFilter();
    alert('导入完成，共 '+Object.keys(favs).length+' 首收藏。');
  }catch(e){ alert('解析失败：'+e.message); }
}

// ===== 歌词 =====
function parseLrc(text){
  text = String(text||'');
  if(!text.trim()) return null;
  const re = /\[(\d+):(\d+(?:\.\d+)?)\]/g;
  if(!re.test(text)){
    return {plain: text.split(/\n/).map(s=>s.trim()).filter(Boolean)};
  }
  re.lastIndex = 0;
  const out = [];
  let m, last = 0, lines = text.split(/\n/);
  for(const ln of lines){
    let t = null;
    while((m = re.exec(ln)) !== null){ t = (+m[1])*60 + (+m[2]); }
    const content = ln.replace(re,'').trim();
    if(content){ out.push({t: t!=null?t:last, text:content}); if(t!=null) last = t; }
  }
  out.sort((a,b)=>a.t-b.t);
  return out.length ? out : null;
}
let lrcDom = null;
function showLyric(lrc, t){
  const box = document.getElementById('lyricBox');
  if(!lrc){ box.style.display='none'; return; }
  box.classList.toggle('mv', curMedia === mvPlayer);
  box.style.textAlign = 'center';
  if(lrc.plain){
    // 无时间轴歌词：多行展示，可滚动
    box.classList.remove('single'); box.classList.add('plain');
    if(!lrcDom || lrcDom.lrc !== lrc || !lrcDom.plain){
      box.innerHTML = lrc.plain.map(s=>'<div class="lrcline">'+s+'</div>').join('');
      lrcDom = {lrc, plain:true, els:Array.from(box.querySelectorAll('.lrcline')), lastIdx:-2};
      box.scrollTop = 0;
    }
    box.style.display='block';
    return;
  }
  // 时间轴歌词：单行显示当前句，超长横向滚动
  box.classList.add('single'); box.classList.remove('plain');
  let idx = -1;
  for(let i=lrc.length-1;i>=0;i--){ if(lrc[i].t <= t+0.2){ idx = i; break; } }
  if(idx<0){
    // 前奏/未到第一句：显示第一句预览（置灰），不空白
    box.style.display='block';
    if(!lrcDom || lrcDom.lrc !== lrc || lrcDom.plain){
      box.innerHTML = '<div class="lrcwrap"><span class="lrcline pre"></span></div>';
      lrcDom = {lrc, plain:false, lastIdx:-2};
    }
    if(lrcDom.lastIdx !== -1){
      lrcDom.lastIdx = -1;
      const el = box.querySelector('.lrcline');
      el.textContent = lrc[0].text;
    }
    return;
  }
  box.style.display='block';
  if(!lrcDom || lrcDom.lrc !== lrc || lrcDom.plain){
    box.innerHTML = '<div class="lrcwrap"><span class="lrcline"></span></div>';
    lrcDom = {lrc, plain:false, lastIdx:-2};
  }
  if(lrcDom.lastIdx !== idx){
    lrcDom.lastIdx = idx;
    const el = box.querySelector('.lrcline');
    el.textContent = lrc[idx].text;
    const wrap = box.querySelector('.lrcwrap');
    requestAnimationFrame(()=>{
      const over = el.scrollWidth > wrap.clientWidth;
      el.classList.toggle('long', over);
    });
  }
}
// 曲目清单（白兰完整版等含 tracks 字段的条目）：点击跳转到对应时间点
function renderTracks(s, lrc){
  const box = document.getElementById('trackBox');
  if(!s || !s.tracks || !s.tracks.length || curMedia === mvPlayer){ box.style.display='none'; return; }
  window._curTracks = s.tracks;
  box.innerHTML = '<div class="ttl">曲目清单 · 点击任意一首跳转选听</div>' + s.tracks.map(t=>
    '<div class="tk" data-t="'+t.t+'" data-i="'+t.n+'"><span class="no">'+t.n+'</span><span class="tm">'+fmt(t.t)+'</span><span class="nm">'+esc(t.name)+'</span></div>'
  ).join('');
  box.style.display='block';
  box.onclick = e=>{
    const row = e.target.closest('.tk');
    if(!row) return;
    const t = parseFloat(row.dataset.t);
    if(Number.isNaN(t)) return;
    curMedia.currentTime = t;
    if(lrc) showLyric(lrc, t);
    box.querySelectorAll('.tk').forEach(r=>r.classList.toggle('cur', r===row));
    const wrap = box.querySelector('.ttl'); if(wrap) wrap.textContent='曲目清单 · 正在播 第'+row.dataset.i+'首';
  };
}
function markCurTrack(){
  const box = document.getElementById('trackBox');
  if(!box || box.style.display==='none' || !window._curTracks) return;
  const t = curMedia.currentTime || 0;
  let idx = 0;
  for(let i=0;i<window._curTracks.length;i++){ if(window._curTracks[i].t <= t) idx = i; }
  const rows = box.querySelectorAll('.tk');
  rows.forEach((r,i)=>r.classList.toggle('cur', i===idx));
  const cur = rows[idx]; if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}

// ===== h5player 扩展菜单左移 =====
// 该扩展的"菜单"下拉锚在顶栏最右侧按钮上且默认向右展开，会超出屏幕右边被裁切（设置项看不见）。
// 扩展把顶栏注入普通页面 DOM，这里用站点脚本持续把它的下拉改为 bottom-end（向左展开）。
(function(){
  function fixH5pMenus(){
    try{
      document.querySelectorAll('.h5player-popup-wrap sl-dropdown').forEach(function(d){
        if(d.getAttribute('placement') !== 'bottom-end'){
          d.setAttribute('placement', 'bottom-end');
        }
      });
    }catch(e){}
  }
  var pending = false;
  new MutationObserver(function(){
    if(pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; fixH5pMenus(); });
  }).observe(document.documentElement, {childList:true, subtree:true});
  document.addEventListener('DOMContentLoaded', fixH5pMenus);
  fixH5pMenus();
})();

let rankCur = 0;
function toggleRank(){
  const el = document.getElementById('rankPanel');
  const show = el.style.display !== 'block';
  el.style.display = show ? 'block' : 'none';
  if(show){
    const o = document.getElementById('onlineSearch');
    if(o) o.style.display = 'none';
    if(!el.dataset.inited){ renderRank(); el.dataset.inited = '1'; }
  }
}
function rkFmtWan(n){ return n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,'') + ' 万' : String(n); }
function renderRank(){
  const body = document.getElementById('rankBody');
  const c = RANK_CHARTS[rankCur];
  if(!c) return;
  const medal = i => i===0 ? '🥇' : i===1 ? '🥈' : '🥉';
  let tabs = '<div class="rk-tabs">' + RANK_CHARTS.map((x,i)=>
    '<span class="rk-tab'+(i===rankCur?' on':'')+'" onclick="rankSwitch('+i+')">'+esc(x.name)+'</span>').join('') + '</div>';
  let meta = '<div class="rk-meta">'+rkFmtWan(c.listenNum)+'人在听 · 数据快照 2026-11-01 · 点「试听」直接播，点「归队」标记进歌单</div>';
  let rows = '<div class="rk-list">' + c.songs.map((s,i)=>
    '<div class="rk-row">'
    + '<span class="rk-no">'+(i<3 ? medal(i) : (i+1))+'</span>'
    + '<img class="rk-cov" src="'+esc(s.c)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
    + '<div class="rk-meta3"><div class="rk-t">'+esc(s.n)+'</div><div class="rk-a">'+esc(s.a)+' · '+esc(s.al)+'</div></div>'
    + '<button class="rk-play sm" onclick="rankTry(this,\''+escJs(s.n)+'\',\''+escJs(s.a)+'\')">试听</button>'
    + '<button class="rk-want sm" onclick="rankWant(this,\''+escJs(s.n)+'\',\''+escJs(s.a)+'\')">归队</button>'
    + '</div>').join('') + '</div>';
  body.innerHTML = tabs + meta + rows;
}
function rankSwitch(i){ rankCur = i; renderRank(); }
function rankSearchFirst(name, artist, cb){
  fetch(SEARCH_API + '/search?kw=' + encodeURIComponent(name + ' ' + artist))
    .then(r=>r.json())
    .then(j=>{
      const hit = (j.playable || [])[0];
      if(!hit){ alert('没找到「'+name+'」的可播放版本'); return; }
      cb(hit);
    })
    .catch(e=>alert('搜索失败：'+e.message));
}
function rankTry(btn, name, artist){
  if(btn) btn.textContent = '搜索中…';
  rankSearchFirst(name, artist, hit=>{
    if(btn) btn.textContent = '试听';
    playOnline(hit.source, hit.id, name, artist, hit.url);
  });
}
function rankWant(btn, name, artist){
  rankSearchFirst(name, artist, hit=>{ wantAdd(btn, hit.source, hit.id); });
}
